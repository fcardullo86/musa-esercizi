<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <div id="foto" class="row"></div>
    <!-- Esercizio
Utilizza l’endpoint https://jsonplaceholder.typicode.com/photos per costruire
il markup di una pagina web.
● Effettua una chiamata fetch
● Costruisci gli elementi HTML e mostrali in pagina
● Limita il numero di elementi mostrati a 10
● Puoi utilizzare Bootstrap per lo stile -->
<script>
    fetch('https://jsonplaceholder.typicode.com/photos')
    .then(response => {
        if(!response.ok) throw new Error('Qualcosa è andato storto');

        return response.json();
    })
    .then(photos=>{
        photos.slice(0,10).forEach(f=>{
            const div = document.createElement('div');
            const img = document.createElement('img');
            const p = document.createElement('p');
            p.innerText = f.title;
            img.src = f.thumbnailUrl;
            div.classList.add("col-3");
            img.classList.add("img-fluid");
            div.append(img, p)
            document.getElementById('foto').append(div)
        })
    })

    
</script>

</body>
</html>
